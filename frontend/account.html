<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="mQlGSmTbCYFctZavIyGIMyBsTILOaBCQHSwizkSydew">
  <meta name="description" content="GLIMPSE is a university research tool that shows how sure machine-learning models are about a prediction, and what would change it.">
  <title>My account — GLIMPSE</title>
  <script>
    // Apply the saved theme before the page renders.
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = (q === "dark" || q === "light") ? q
              : localStorage.getItem("glimpse-theme");
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        var p = localStorage.getItem("glimpse-palette");
        if (p) document.documentElement.setAttribute("data-palette", p);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="account">
  <header id="titlebar">
    <a class="brand" href="/">GLIMPSE</a>
    <nav id="nav" aria-label="Main">
      <a href="/" data-page="home">Home</a>
      <a href="/app.html" data-page="app">Map</a>
      <a href="/compare.html" data-page="compare">Compare</a>
      <a href="/how.html" data-page="how">How it works</a>
      <a href="/account.html" data-page="account" id="account-link">My account</a>
    </nav>
    <button id="theme-toggle" class="theme-btn" type="button"
            aria-label="Toggle light and dark mode"></button>
  </header>

  <main id="account" class="account-wide" hidden>
    <h1 class="page-h">My account</h1>
    <p id="account-notice" class="notice" role="status" hidden></p>

    <section class="acct-card">
      <div class="acct-row"><span class="sub">Email</span><b id="acct-email"></b></div>
      <div class="acct-row"><span class="sub">Member since</span><span id="acct-since"></span></div>
      <p><button type="button" id="acct-signout">Sign out</button></p>
    </section>

    <section class="acct-card" aria-labelledby="colors-h">
      <h2 id="colors-h">Colours</h2>
      <div id="palette-picker" class="palette-grid" role="radiogroup" aria-labelledby="colors-h"></div>
      <p class="sub">Used on every page. Saved in this browser.</p>
    </section>

    <section class="acct-card" aria-labelledby="saves-h">
      <h2 id="saves-h">Your saves</h2>
      <div id="acct-saves"></div>
    </section>

    <section class="acct-card" aria-labelledby="pw-h">
      <h2 id="pw-h">Change password</h2>
      <form id="form-password" class="auth-form" novalidate>
        <label for="pw-current">Current password</label>
        <input id="pw-current" name="current" type="password" autocomplete="current-password" required>
        <label for="pw-new">New password <span class="unit">8+ characters</span></label>
        <input id="pw-new" name="new" type="password" autocomplete="new-password" minlength="8" required>
        <label for="pw-confirm">Confirm new password</label>
        <input id="pw-confirm" name="confirm" type="password" autocomplete="new-password" required>
        <p class="auth-msg" role="alert" aria-live="polite"></p>
        <button type="submit" class="auth-submit">Change password</button>
        <p class="sub">Other browsers get signed out. Forgot it?
          <a href="/login.html" id="acct-forgot">Reset by email</a></p>
      </form>
    </section>

    <section class="acct-card danger" aria-labelledby="del-h">
      <h2 id="del-h">Delete account</h2>
      <p class="sub">Removes your account and every save. This can’t be undone.</p>
      <form id="form-delete" class="auth-form" novalidate>
        <label for="del-password">Password</label>
        <input id="del-password" name="password" type="password" autocomplete="current-password" required>
        <label class="check"><input type="checkbox" id="del-confirm" name="sure">
          I understand my saves will be gone</label>
        <p class="auth-msg" role="alert" aria-live="polite"></p>
        <button type="submit" class="auth-submit danger-btn">Delete my account</button>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/common.js"></script>
  <script src="/account.js"></script>
</body>
</html>
